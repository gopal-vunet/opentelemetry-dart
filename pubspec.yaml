name: opentelemetry
version: 0.18.8
description: A framework for collecting OpenTelemetry traces from applications.
environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  async: '>=2.5.0 <3.0.0'
  collection: ^1.15.0
  fixnum: '>=1.0.0 <2.0.0'
  http: '>=0.13.0 <2.0.0'
  logging: ^1.0.0
  meta: '>=1.9.1 <2.0.0'
  protobuf: '>=2.0.0 <4.0.0'
  quiver: '>=3.0.0 <4.0.0'
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  clock: ^1.1.2
  synchronized: ^3.3.1

dev_dependencies:
  build_runner: ^2.3.3
  build_test: ^2.2.1
  build_web_compilers: '>=3.2.7 <5.0.0'
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  remove_from_coverage: ^2.0.0
  test: ^1.24.2
  workiva_analysis_options: ^1.2.2

flutter:
  uses-material-design: true
  plugin: 
    platforms:
      android:
        package: com.example.opentelemetry
        pluginClass: OpentelemetryPlugin
      ios:
        pluginClass: OpentelemetryPlugin
